<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad-512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gold-grad-512" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury App Icon Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg-grad-512)" stroke="url(#border-grad-512)" stroke-width="16"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Antenna & Signal Orb -->
  <path d="M186 186L282 90" stroke="url(#gold-grad-512)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="282" cy="90" r="24" fill="#fbbf24" filter="url(#glow-512)"/>

  <!-- Radiating Broadcast Waves -->
  <path d="M308 58C340 86 340 128 308 156" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <path d="M340 26C394 80 394 172 340 226" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

  <!-- Radio Body -->
  <rect x="112" y="186" width="288" height="218" rx="48" fill="#0f172a" stroke="url(#gold-grad-512)" stroke-width="16"/>

  <!-- Speaker Grill / Equalizer Lines -->
  <rect x="148" y="234" width="118" height="122" rx="22" fill="#1e293b"/>
  <line x1="176" y1="266" x2="238" y2="266" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
  <line x1="176" y1="295" x2="218" y2="295" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  <line x1="176" y1="324" x2="238" y2="324" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>

  <!-- Tuner Dials -->
  <circle cx="326" cy="250" r="34" fill="#1e293b" stroke="#38bdf8" stroke-width="14"/>
  <circle cx="326" cy="250" r="13" fill="#38bdf8"/>
  <circle cx="326" cy="336" r="24" fill="#1e293b" stroke="#fbbf24" stroke-width="10"/>
</svg>
