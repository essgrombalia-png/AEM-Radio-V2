<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury App Icon Base -->
  <rect x="8" y="8" width="176" height="176" rx="44" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6"/>
  <rect x="16" y="16" width="160" height="160" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Antenna & Signal Orb -->
  <path d="M70 70L106 34" stroke="url(#gold-grad)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="106" cy="34" r="9" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Radiating Broadcast Waves -->
  <path d="M116 22C128 32 128 48 116 58" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M128 10C148 30 148 64 128 84" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Radio Body -->
  <rect x="42" y="70" width="108" height="82" rx="18" fill="#0f172a" stroke="url(#gold-grad)" stroke-width="6"/>

  <!-- Speaker Grill / Equalizer Lines -->
  <rect x="56" y="88" width="44" height="46" rx="8" fill="#1e293b"/>
  <line x1="66" y1="100" x2="90" y2="100" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="111" x2="82" y2="111" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="122" x2="90" y2="122" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>

  <!-- Tuner Dials -->
  <circle cx="122" cy="94" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="122" cy="94" r="5" fill="#38bdf8"/>
  <circle cx="122" cy="126" r="9" fill="#1e293b" stroke="#fbbf24" stroke-width="4"/>
</svg>
